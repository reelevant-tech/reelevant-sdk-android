name: Android CI

on:
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: gradle/wrapper-validation-action@v3.5.0
      - uses: actions/setup-java@v4.9.1
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4.4.3

      - name: Lint
        run: ./gradlew :analytics-android:lint

      - name: Run unit tests
        run: ./gradlew :analytics-android:test

      - name: Build
        run: ./gradlew :analytics-android:assembleRelease
